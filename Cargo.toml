# One Cargo workspace for both apps (phase 1). Each app keeps its own folder, crates and
# version; they are built and tested together. Phase 6 merges the duplicate crates.
[workspace]
resolver = "3"
members = [
    "lightcraft/crates/*", "lightcraft/apps/*", "lightcraft/xtask",
    "photocraft/crates/*", "photocraft/apps/*", "photocraft/xtask",
]
# `cargo build` / `cargo test` with no -p: everything except the two browser builds.
default-members = [
    "lightcraft/crates/*", "lightcraft/apps/lightcraft", "lightcraft/apps/lightcraft-cli", "lightcraft/xtask",
    "photocraft/crates/*", "photocraft/apps/photocraft", "photocraft/apps/photocraft-cli", "photocraft/xtask",
]

[workspace.package]
# Crate versions stay per app: PhotoCraft crates inherit this one, LightCraft crates state 0.7.1.
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# --- LightCraft ---
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
# internal
lightcraft-denoise-core = { path = "lightcraft/crates/denoise-core" }
lightcraft-denoise = { path = "lightcraft/crates/denoise", default-features = false }
lightcraft-geom = { path = "lightcraft/crates/geom" }
lightcraft-faces = { path = "lightcraft/crates/faces" }
lightcraft-sysmem = { path = "lightcraft/crates/sysmem" }
lightcraft-color = { path = "lightcraft/crates/color" }
lightcraft-raster = { path = "lightcraft/crates/raster" }
lightcraft-tiff = { path = "lightcraft/crates/tiff" }
lightcraft-raw = { path = "lightcraft/crates/raw" }
lightcraft-codecs = { path = "lightcraft/crates/codecs" }
lightcraft-meta = { path = "lightcraft/crates/meta" }
lightcraft-develop = { path = "lightcraft/crates/develop" }
lightcraft-lensdb = { path = "lightcraft/crates/lensdb" }
lightcraft-inpaint = { path = "lightcraft/crates/inpaint" }
lightcraft-scenes = { path = "lightcraft/crates/scenes" }
lightcraft-pipeline = { path = "lightcraft/crates/pipeline" }
lightcraft-gpu = { path = "lightcraft/crates/gpu" }
lightcraft-catalog = { path = "lightcraft/crates/catalog" }
lightcraft-preview = { path = "lightcraft/crates/preview" }
lightcraft-merge = { path = "lightcraft/crates/merge" }
lightcraft-engine = { path = "lightcraft/crates/engine" }
lightcraft-ui-egui = { path = "lightcraft/crates/ui-egui" }
lightcraft-mcp = { path = "lightcraft/crates/mcp" }
lightcraft-fetch = { path = "lightcraft/crates/fetch" }
lightcraft-heif = { path = "lightcraft/crates/heif" }
lightcraft-segment = { path = "lightcraft/crates/segment" }
lightcraft-geocode = { path = "lightcraft/crates/geocode" }

# foundation
thiserror = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
rayon = "1"
proptest = "1"
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1"
siphasher = "1"
libc = "0.2" # dev-only: process CPU time in benches
dhat = "0.3" # opt-in heap profiling (lightcraft-cli --features dhat-heap); never in default builds

# formats
quick-xml = "0.38"
miniz_oxide = "0.8"

# codecs
image = { version = "0.25", default-features = false }
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "x86", "neon"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }  # Apache-2.0, pure Rust glyph rasterizer (export watermarks)
png = "0.18"
tiff = "0.11"
image-webp = "0.2"
moxcms = { version = "0.9", default-features = false, features = ["lut"] }
jxl-oxide = { version = "0.12", default-features = false }
jixel = "=0.3.4" # BSD-3-Clause OR Apache-2.0, pure-Rust JPEG XL encoder (export; port of libjxl-tiny)
zune-jpegxl = { version = "0.5", default-features = false, features = ["std"] } # MIT/Apache-2.0/Zlib lossless JXL encoder (test fixtures only)
ravif = { version = "0.13", default-features = false, features = ["threading"] } # no "asm": it needs nasm (non-Rust)
# HDR AVIF (PQ): ravif fixes the sRGB transfer curve, so HDR files drive its rav1e + avif-serialize directly
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }
avif-serialize = "0.8.6"

# gpu (crates/gpu; native backends only, no GL: everything stays pure Rust)
# SAM 3 inference (lightcraft-segment). 0.9.2: later releases pull `tokenizers` with the
# Oniguruma C library into candle-core, and the product is pure Rust.
candle-core = { version = "=0.9.2", default-features = false }
candle-nn = { version = "=0.9.2", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
pollster = "1"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
muda = { version = "0.21", default-features = false } # native menu bar (macOS: objc2/AppKit, pure Rust; no GTK)
# macOS: the profile of the screen showing the window (safe AppKit bindings; muda and wgpu use the same)
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSColorSpace", "NSResponder", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData"] }
# Linux: the desktop's dark/light setting from the XDG settings portal (Settings ▸ Interface ▸
# Appearance Mode ▸ Auto). Pure Rust; the version accesskit already brings in, pinned to it.
zbus = "=5.19.0"
web-time = "1"

# web (apps/lightcraft-web)
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

# --- PhotoCraft (entries LightCraft already declares are listed above) ---
# internal
photocraft-geom = { path = "photocraft/crates/geom" }
photocraft-color = { path = "photocraft/crates/color" }
photocraft-cms = { path = "photocraft/crates/cms" }
photocraft-raster = { path = "photocraft/crates/raster" }
photocraft-doc = { path = "photocraft/crates/doc" }
photocraft-ops = { path = "photocraft/crates/ops" }
photocraft-psd = { path = "photocraft/crates/psd" }
photocraft-codecs = { path = "photocraft/crates/codecs" }
photocraft-raw = { path = "photocraft/crates/raw" }
photocraft-affinity = { path = "photocraft/crates/affinity" }
photocraft-compose = { path = "photocraft/crates/compose" }
photocraft-gpu = { path = "photocraft/crates/gpu" }
photocraft-paint = { path = "photocraft/crates/paint" }
photocraft-algo = { path = "photocraft/crates/algo" }
photocraft-io = { path = "photocraft/crates/io" }
photocraft-text = { path = "photocraft/crates/text" }
photocraft-vector = { path = "photocraft/crates/vector" }
photocraft-format = { path = "photocraft/crates/format" }
photocraft-automation = { path = "photocraft/crates/automation" }
photocraft-plugins = { path = "photocraft/crates/plugins" }
photocraft-engine = { path = "photocraft/crates/engine" }
photocraft-ui-egui = { path = "photocraft/crates/ui-egui" }
photocraft-testkit = { path = "photocraft/crates/testkit" }
photocraft-tablet = { path = "photocraft/crates/tablet" }

# external
arc-swap = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Baseline-JPEG decode of lossy DNG tiles (compression 34892), shared with zune-jpeg.
criterion = { version = "0.5", default-features = false }
getrandom = "0.3"

# Lints: the union of both apps' settings. `unsafe_code` is "deny" (LightCraft's), not
# PhotoCraft's "forbid", so lightcraft-sysmem's single allowed unsafe call still builds.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# PhotoCraft's release settings (thin LTO, one codegen unit) now apply to LightCraft too:
# slower to build, same pixels.
[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = false

# `cargo xtask web`: the browser build. Size matters more than build time: fat LTO, one codegen
# unit, no symbols, abort on panic (wasm32 can't unwind anyway), size-optimized code — except the
# crates that do per-pixel work, which stay at opt-level 3 (opt-level "s"/"z" there costs ~50 %/
# ~130 % render time; measured in docs/web.md → Bundle size).
[profile.web]
inherits = "release"
debug = false
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"

[profile.web.package]
lightcraft-pipeline = { opt-level = 3 }
lightcraft-raster = { opt-level = 3 }
lightcraft-color = { opt-level = 3 }
lightcraft-develop = { opt-level = 3 }
lightcraft-geom = { opt-level = 3 }
lightcraft-raw = { opt-level = 3 }
lightcraft-codecs = { opt-level = 3 }
lightcraft-scenes = { opt-level = 3 }
lightcraft-preview = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
zune-core = { opt-level = 3 }
jpeg-decoder = { opt-level = 3 }
jpeg-encoder = { opt-level = 3 }
png = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }

# The browser build (apps/photocraft-web, `data-cargo-profile` in its index.html). Hosts cap the
# size of a single file (Cloudflare Pages/Workers: 25 MiB), and the wasm is downloaded on every
# visit, so this profile optimizes for size: fat LTO, opt-level "z" for the UI, command, and I/O
# shells, and "s" for other crates except pixel processing, which keeps opt-level 3. panic
# stays the target default (wasm32-unknown-unknown aborts; AGENTS.md's `panic = "unwind"` is for
# the native app shell). packaging/web/package.sh fails the build above 24 MiB.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release.package."*"]
opt-level = "s"

# Keep the browser shell compact as shared panel controls grow. Pixel-processing crates below
# retain their speed-oriented optimization level.
[profile.wasm-release.package.photocraft-ui-egui]
opt-level = "z"

# Keep browser command dispatch, import/export glue, and the entry point compact. Native
# builds and the speed-oriented pixel-processing overrides below retain their settings.
[profile.wasm-release.package.photocraft-engine]
opt-level = "z"
[profile.wasm-release.package.photocraft-io]
opt-level = "z"
[profile.wasm-release.package.photocraft-web]
opt-level = "z"

[profile.wasm-release.package.photocraft-raster]
opt-level = 3
[profile.wasm-release.package.photocraft-color]
opt-level = 3
[profile.wasm-release.package.photocraft-cms]
opt-level = 3
[profile.wasm-release.package.photocraft-compose]
opt-level = 3
[profile.wasm-release.package.photocraft-algo]
opt-level = 3
[profile.wasm-release.package.photocraft-paint]
opt-level = 3
