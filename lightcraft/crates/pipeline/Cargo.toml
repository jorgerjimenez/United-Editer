[package]
name = "lightcraft-pipeline"
version = "0.7.1"
edition.workspace = true
license.workspace = true
description = "LightCraft develop pipeline: scene-referred, float, resolution independent (CPU reference) (L2)"

[lints]
workspace = true

[dependencies]
lightcraft-geom = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-develop = { workspace = true }
lightcraft-raw = { workspace = true }
lightcraft-inpaint = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
lightcraft-scenes = { workspace = true }
proptest = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "tiff", "webp"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
